<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeAgent 챗봇 위젯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 40px 24px;
        }

        .page-header { max-width: 960px; margin: 0 auto 28px; }
        .page-header h1 { font-size: 1.6em; color: #1e3c72; margin-bottom: 8px; }
        .page-header p { color: #64748b; line-height: 1.6; }

        .grid {
            max-width: 960px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 340px));
            justify-content: center;
            gap: 20px;
        }

        .bot-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 28px;
            display: flex;
            flex-direction: column;
        }

        .bot-card h2 { font-size: 1.15em; color: #1e3c72; margin-bottom: 10px; }
        .bot-card p.desc { color: #475569; line-height: 1.6; margin-bottom: 10px; flex-grow: 1; }
        .bot-card code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; color: #64748b; word-break: break-all; margin-bottom: 16px; display: inline-block; }

        .bot-card button {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            border: none;
            padding: 14px 16px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(30,60,114,0.28);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95em;
            font-weight: 700;
            letter-spacing: 0.3px;
            transition: background 0.2s, transform 0.15s;
        }
        .bot-card button:hover { background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%); transform: translateY(-1px); }
        .bot-card button:active { transform: translateY(0); }

        /* OfficeAgent 위젯의 기본 플로팅 버튼은 숨기고, 카드 버튼으로만 열고 닫음 */
        .widget-launcher { display: none !important; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>OfficeAgent 챗봇 위젯 테스트</h1>
        <p>카드별로 서로 다른 챗봇(site_key)을 등록해두고, 버튼을 눌러 해당 챗봇을 열어볼 수 있습니다. 새 챗봇을 추가하려면 아래 스크립트의 <code>CHATBOTS</code> 배열에 항목만 추가하면 됩니다.</p>
    </div>

    <div class="grid" id="botGrid"></div>

    <!-- OfficeAgent 임베드 챗봇 -->
    <script type="module" src="https://chatbot.officeagent.kr/widget-loader.js"></script>
    <script type="module">
        // 새 챗봇을 추가하려면 이 배열에 항목만 추가하면 됩니다.
        const CHATBOTS = [
            {
                name: '오피스키퍼 EP 체크리스트 도우미',
                description: '오피스키퍼 EP 체크리스트 관련 문의를 답변하는 챗봇입니다.',
                site_key: 'pk_fa2cdb11d3287e9ca8a0a335ce9db031',
            },
        ];

        const grid = document.getElementById('botGrid');
        CHATBOTS.forEach((bot, idx) => {
            const card = document.createElement('div');
            card.className = 'bot-card';
            card.innerHTML = `
                <h2>${bot.name}</h2>
                <p class="desc">${bot.description}</p>
                <code>${bot.site_key}</code>
                <button type="button" data-idx="${idx}" aria-label="${bot.name} 열기">💬 상담 시작하기</button>
            `;
            grid.appendChild(card);
        });

        let activeWidget = null;
        let activeSiteKey = null;

        grid.addEventListener('click', function (e) {
            const btn = e.target.closest('button[data-idx]');
            if (!btn) return;
            const bot = CHATBOTS[Number(btn.dataset.idx)];

            if (activeSiteKey === bot.site_key && activeWidget) {
                activeWidget.open();
                return;
            }
            if (activeWidget) {
                activeWidget.destroy();
            }
            activeWidget = window.ChatWidget.init({
                site_key: bot.site_key,
                // 선택: 로그인 사용자 식별 시
                // customer: 'BASE64(로그인 사용자 식별자)',
            });
            activeSiteKey = bot.site_key;
            activeWidget.open();
        });
    </script>
</body>
</html>
