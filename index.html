<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeAgent 챗봇 위젯</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231e3c72'/><text x='32' y='43' font-size='30' text-anchor='middle'>%F0%9F%92%AC</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 40px 24px;
        }

        .page-header { max-width: 960px; margin: 0 auto 28px; }
        .page-header h1 { font-size: 1.6em; color: #1e3c72; margin-bottom: 8px; }
        .page-header p { color: #64748b; line-height: 1.6; }

        .grid {
            max-width: 960px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 340px));
            justify-content: center;
            gap: 20px;
        }

        .bot-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 28px;
            display: flex;
            flex-direction: column;
        }

        .bot-card h2 { font-size: 1.15em; color: #1e3c72; margin-bottom: 10px; }
        .bot-card p.desc { color: #475569; line-height: 1.6; margin-bottom: 10px; flex-grow: 1; }
        .bot-card p.desc.error { color: #c0392b; }
        .bot-card code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; color: #64748b; word-break: break-all; margin-bottom: 16px; display: inline-block; }

        .bot-card button {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            border: none;
            padding: 14px 16px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(30,60,114,0.28);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95em;
            font-weight: 700;
            letter-spacing: 0.3px;
            transition: background 0.2s, transform 0.15s;
        }
        .bot-card button:hover { background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%); transform: translateY(-1px); }
        .bot-card button:active { transform: translateY(0); }

        /* OfficeAgent 위젯의 기본 플로팅 버튼은 숨기고, 카드 버튼으로만 열고 닫음 */
        .widget-launcher { display: none !important; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>OfficeAgent 챗봇 위젯 테스트</h1>
        <p>카드별로 서로 다른 챗봇(site_key)을 등록해두고, 버튼을 눌러 해당 챗봇을 열어볼 수 있습니다. 제목/설명은 OfficeAgent에 등록된 실제 봇 설정을 그때그때 불러와 표시하므로, 그쪽에서 이름/설명을 바꾸면 이 페이지에도 자동으로 반영됩니다. 새 챗봇을 추가하려면 아래 스크립트의 <code>CHATBOTS</code> 배열에 site_key만 추가하면 됩니다.</p>
    </div>

    <div class="grid" id="botGrid"></div>

    <!-- OfficeAgent 임베드 챗봇 -->
    <script type="module" src="https://chatbot.officeagent.kr/widget-loader.js"></script>
    <script type="module">
        // 새 챗봇을 추가하려면 이 배열에 site_key만 추가하면 됩니다. 이름/설명은 OfficeAgent에서 자동으로 가져옵니다.
        const CHATBOTS = [
            { site_key: 'pk_fa2cdb11d3287e9ca8a0a335ce9db031' },
            { site_key: 'pk_8c28225ba3877e8490fc6ad47cfbf0fb' },
        ];

        const grid = document.getElementById('botGrid');
        const cards = CHATBOTS.map((bot, idx) => {
            const card = document.createElement('div');
            card.className = 'bot-card';
            card.innerHTML = `
                <h2>불러오는 중...</h2>
                <p class="desc"></p>
                <code>${bot.site_key}</code>
                <button type="button" data-idx="${idx}" aria-label="챗봇 열기">💬 챗봇 실행</button>
            `;
            grid.appendChild(card);
            return card;
        });

        async function loadBotInfo(bot, card) {
            const h2 = card.querySelector('h2');
            const desc = card.querySelector('p.desc');
            const btn = card.querySelector('button');
            try {
                const res = await fetch('https://api-agent.officemail.ai/api/v1/guest/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ site_key: bot.site_key }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
                bot.name = data.chatbot_name || (data.agent && data.agent.name) || bot.site_key;
                bot.description = (data.agent && data.agent.description) || '';
                h2.textContent = bot.name;
                desc.textContent = bot.description;
                btn.setAttribute('aria-label', bot.name + ' 열기');
            } catch (err) {
                h2.textContent = '불러오기 실패';
                desc.textContent = '이 도메인이 OfficeAgent 허용 도메인 목록에 등록되어 있는지 확인해주세요. (' + err.message + ')';
                desc.classList.add('error');
            }
        }

        CHATBOTS.forEach((bot, idx) => loadBotInfo(bot, cards[idx]));

        let activeWidget = null;
        let activeSiteKey = null;

        grid.addEventListener('click', function (e) {
            const btn = e.target.closest('button[data-idx]');
            if (!btn) return;
            const bot = CHATBOTS[Number(btn.dataset.idx)];

            if (activeSiteKey === bot.site_key && activeWidget) {
                activeWidget.open();
                return;
            }
            if (activeWidget) {
                activeWidget.destroy();
            }
            activeWidget = window.ChatWidget.init({
                site_key: bot.site_key,
                // 선택: 로그인 사용자 식별 시
                // customer: 'BASE64(로그인 사용자 식별자)',
            });
            activeSiteKey = bot.site_key;
            activeWidget.open();
        });
    </script>
</body>
</html>
