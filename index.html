<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeAgent 챗봇 위젯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 560px;
            width: 100%;
            padding: 32px;
        }

        h1 { font-size: 1.4em; color: #1e3c72; margin-bottom: 12px; }
        p { color: #475569; line-height: 1.6; margin-bottom: 8px; }
        code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="card">
        <h1>OfficeAgent 챗봇 위젯 테스트</h1>
        <p>아래 버튼을 눌러 챗봇 위젯을 열어보세요.</p>
        <p>이 프로젝트는 다른 사이트(캘린더 등)에 챗봇을 붙이기 전, 위젯 연동을 독립적으로 테스트/관리하기 위한 용도입니다.</p>
        <p>site_key: <code>pk_fa2cdb11d3287e9ca8a0a335ce9db031</code></p>

        <!-- 챗봇 버튼 -->
        <button id="chatbotSideBtn" type="button" aria-label="AI 챗봇 열기">💬 AI 상담 시작하기</button>
    </div>

    <style>
        #chatbotSideBtn {
            display: block;
            width: 100%;
            margin-top: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            border: none;
            padding: 18px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(30,60,114,0.28);
            cursor: pointer;
            font-family: inherit;
            font-size: 1.05em;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: background 0.2s, transform 0.15s;
        }
        #chatbotSideBtn:hover { background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%); transform: translateY(-1px); }
        #chatbotSideBtn:active { transform: translateY(0); }
        /* OfficeAgent 위젯의 기본 플로팅 버튼은 숨기고, 위 커스텀 버튼으로 대체 */
        .widget-launcher { display: none !important; }
    </style>

    <!-- OfficeAgent 임베드 챗봇 -->
    <script type="module" src="https://chatbot.officeagent.kr/widget-loader.js"></script>
    <script type="module">
        const chatWidget = window.ChatWidget.init({
            site_key: 'pk_fa2cdb11d3287e9ca8a0a335ce9db031',
            // 선택: 로그인 사용자 식별 시
            // customer: 'BASE64(로그인 사용자 식별자)',
        });
        document.getElementById('chatbotSideBtn').addEventListener('click', function () {
            chatWidget.open();
        });
    </script>
</body>
</html>
