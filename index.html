<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 챗봇 테스트</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231e3c72'/><text x='32' y='43' font-size='30' text-anchor='middle'>%F0%9F%92%AC</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 56px 24px;
        }

        .page-header { max-width: 880px; margin: 0 auto 36px; text-align: center; }
        .page-header .eyebrow {
            display: inline-block;
            font-size: 0.78em;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: #2a5298;
            background: #e3ebfa;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 14px;
        }
        .page-header h1 { font-size: 1.9em; color: #16264d; margin-bottom: 10px; letter-spacing: -0.3px; }
        .page-header p { color: #64748b; line-height: 1.6; font-size: 0.98em; }

        .grid {
            max-width: 880px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 320px));
            justify-content: center;
            gap: 22px;
        }

        .row-divider { grid-column: 1 / -1; height: 1px; background: rgba(148,163,184,0.3); }

        .bot-card {
            background: #fff;
            border-radius: 18px;
            border: 2px solid transparent;
            box-shadow: 0 6px 28px rgba(16,38,77,0.08);
            padding: 26px;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .bot-card:hover { box-shadow: 0 10px 32px rgba(16,38,77,0.13); transform: translateY(-2px); }

        .bot-card .icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            margin-bottom: 14px;
            overflow: hidden;
        }
        .bot-card .icon.has-avatar { background: none; }
        .bot-card .icon img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .bot-card h2 { font-size: 1.08em; color: #16264d; margin-bottom: 8px; line-height: 1.4; }
        .bot-card p.desc { color: #64748b; line-height: 1.6; margin-bottom: 18px; flex-grow: 1; font-size: 0.92em; }

        .bot-card.is-error .icon { background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%); }
        .bot-card.is-error p.desc { color: #b23b2e; }
        .bot-card .hint { color: #94a3b8; font-size: 0.78em; margin-top: -10px; margin-bottom: 18px; }

        .bot-card .site-key {
            display: none;
            font-size: 0.7em;
            color: #94a3b8;
            font-family: 'Consolas', monospace;
            margin-bottom: 14px;
            word-break: break-all;
        }
        body.reveal-keys .bot-card .site-key { display: block; }

        .page-header .eyebrow { cursor: default; user-select: none; }

        .bot-card button {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            border: none;
            padding: 13px 16px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(30,60,114,0.28);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.92em;
            font-weight: 700;
            letter-spacing: 0.3px;
            transition: background 0.2s, transform 0.15s;
        }
        .bot-card button:hover { background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%); transform: translateY(-1px); }
        .bot-card button:active { transform: translateY(0); }

        /* 로딩 스켈레톤 */
        .skeleton { display: inline-block; height: 0.9em; border-radius: 4px; background: linear-gradient(90deg, #eef1f6 25%, #e2e7ef 37%, #eef1f6 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

        /* OfficeAgent 위젯의 기본 플로팅 버튼은 숨기고, 카드 버튼으로만 열고 닫음 */
        .widget-launcher { display: none !important; }

        .page-footer { max-width: 880px; margin: 40px auto 0; text-align: center; }
        .page-footer .version-link {
            color: #94a3b8; font-size: 0.72em; text-decoration: none;
            background: none; border: none; cursor: pointer; font-family: inherit;
        }
        .page-footer .version-link:hover { color: #2a5298; text-decoration: underline; }
        .site-footer {
            max-width: 880px; margin: 10px auto 0; text-align: center;
            color: #94a3b8; font-size: 0.78rem; letter-spacing: 0.3px;
        }

        .version-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.45);
            z-index: 1600;
            justify-content: center; align-items: center;
        }
        .version-overlay.active { display: flex; }
        .version-box {
            background: #fff; border-radius: 16px; width: 94%;
            max-width: 560px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            overflow: hidden; display: flex; flex-direction: column; max-height: 80vh;
        }
        .version-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff; padding: 16px 22px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .version-header h2 { font-size: 1.1em; font-weight: 700; }
        .version-header .version-close {
            background: none; border: none; color: #fff;
            font-size: 1.5em; cursor: pointer; opacity: 0.85; line-height: 1;
        }
        .version-header .version-close:hover { opacity: 1; }
        .version-body { padding: 18px 22px; overflow-y: auto; }
        .version-entry { padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
        .version-entry:first-child { padding-top: 4px; }
        .version-entry:last-child { border-bottom: none; padding-bottom: 4px; }
        .version-entry-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
        .version-tag {
            display: inline-block; padding: 2px 10px; border-radius: 999px;
            background: #1e3c72; color: #fff; font-weight: 700;
            font-size: 0.88em; font-family: Consolas, monospace;
        }
        .version-tag.current { background: #059669; }
        .version-date { color: #999; font-size: 0.85em; }
        .version-title { color: #333; font-weight: 600; font-size: 0.95em; }
        .version-section { margin-top: 8px; }
        .version-section-label {
            display: inline-block; padding: 1px 8px; border-radius: 4px;
            font-size: 0.78em; font-weight: 700; letter-spacing: 0.3px; margin-bottom: 4px;
        }
        .version-section-label.added { background: #d1fae5; color: #065f46; }
        .version-section-label.changed { background: #dbeafe; color: #1e40af; }
        .version-section-label.fixed { background: #fee2e2; color: #991b1b; }
        .version-section ul { margin: 2px 0 0 4px; padding-left: 1.4em; color: #444; font-size: 0.9em; line-height: 1.6; }
        .version-section li { margin: 1px 0; }
    </style>
</head>
<body>
    <div class="page-header">
        <span class="eyebrow">OFFICEAGENT</span>
        <h1>AI 챗봇 테스트</h1>
        <p>등록된 챗봇 중 하나를 선택해 바로 대화를 시작하세요.</p>
    </div>

    <div class="grid" id="botGrid"></div>

    <div class="page-footer">
        <button type="button" class="version-link" onclick="openVersionModal()">v<span id="appVersionLabel">1.3.1</span> 버전 정보</button>
    </div>
    <footer class="site-footer">© 2026 KHS (miracle38)</footer>

    <div class="version-overlay" id="versionOverlay" onclick="if(event.target===this)closeVersionModal()">
        <div class="version-box">
            <div class="version-header">
                <h2>📋 버전 정보</h2>
                <button class="version-close" onclick="closeVersionModal()" aria-label="닫기">&times;</button>
            </div>
            <div class="version-body" id="versionBody"></div>
        </div>
    </div>

    <!-- OfficeAgent 임베드 챗봇 -->
    <script type="module" src="https://chatbot.officeagent.kr/widget-loader.js"></script>
    <script type="module">
        // 버전 이력 (최신이 위) — 버전 올릴 때 이 배열 맨 앞에 항목 추가 + 푸터 #appVersionLabel 텍스트 변경
        const VERSION_HISTORY = [
            {
                version: '1.3.1',
                date: '2026-08-21',
                title: '모바일 뒤로가기로 챗봇만 닫히도록 수정',
                fixed: [
                    '챗봇을 연 상태에서 모바일 단말기 뒤로가기를 누르면 페이지 전체가 아니라 챗봇 창만 닫히도록 변경 (history.pushState + popstate 활용)',
                ],
            },
            {
                version: '1.3.0',
                date: '2026-08-21',
                title: '줄 사이 구분선 추가',
                added: [
                    '카드가 2열로 줄바꿈되는 지점(줄과 줄 사이)에 흐린 구분선 추가',
                ],
            },
            {
                version: '1.2.5',
                date: '2026-08-21',
                title: '카드 노출 순서 변경',
                changed: [
                    '카드 순서를 오피스키퍼_구축형 → 오피스키퍼 EP → 오피스챗 → 에스원 NEXT 메신저 → 오피스넥스트 플랫폼 순으로 조정',
                ],
            },
            {
                version: '1.2.4',
                date: '2026-08-21',
                title: '카드 테두리 색상 강조',
                changed: [
                    '카드 테두리를 봇 색상 옅은 톤에서 원래 색상 그대로(불투명)로 바꾸고, 두께도 2px로 늘려 더 잘 보이도록 조정',
                ],
            },
            {
                version: '1.2.3',
                date: '2026-08-21',
                title: '하단 버전 정보 문구 축소',
                fixed: [
                    '푸터의 "버전 정보" 링크 글자 크기를 줄여 덜 눈에 띄게 조정',
                ],
            },
            {
                version: '1.2.2',
                date: '2026-08-21',
                title: '카드 테두리에 봇 색상 반영',
                added: [
                    '카드 테두리에 각 봇의 OfficeAgent 설정 색상을 옅게 적용해 카드끼리 구분되도록 변경',
                ],
            },
            {
                version: '1.2.1',
                date: '2026-08-20',
                title: '아이콘 배경 제거',
                fixed: [
                    '아바타 이미지가 있을 때 뒤에 남아있던 파란 배경 박스를 제거해 로고만 깔끔하게 보이도록 수정',
                ],
            },
            {
                version: '1.2.0',
                date: '2026-08-20',
                title: '카드 아이콘을 실제 봇 아바타 이미지로 변경',
                changed: [
                    '카드 좌측 상단 아이콘을 고정 이모지 대신 OfficeAgent에 등록된 실제 봇 아바타 이미지로 표시 (이미지 로드 실패 시 기존 💬 아이콘으로 대체)',
                ],
            },
            {
                version: '1.1.0',
                date: '2026-08-20',
                title: '카드 정리 및 site_key 숨김 처리',
                changed: [
                    '카드 하단의 site_key 표시를 기본적으로 숨기고, 상단 "OFFICEAGENT" 문구를 1초 안에 3번 연속 클릭하면 토글되도록 변경',
                ],
                fixed: [
                    'pk_fa2cdb11d3287e9ca8a0a335ce9db031 챗봇 카드 제거',
                ],
            },
            {
                version: '1.0.0',
                date: '2026-08-20',
                title: '챗봇 테스트 페이지 초기 구성',
                added: [
                    'OfficeAgent 챗봇 위젯 연동 (카드 형식으로 여러 개 등록 가능)',
                    '카드 제목/설명을 OfficeAgent 봇 설정에서 실시간으로 가져와 표시',
                    '탭 파비콘 추가',
                ],
                changed: [
                    'API 호출 결과를 10분 캐시해 새로고침 시 rate limit에 걸리는 문제 완화',
                ],
            },
        ];

        function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        function renderVersionBody() {
            const body = document.getElementById('versionBody');
            if (!body) return;
            const section = (label, items, cls) => {
                if (!items || !items.length) return '';
                return `<div class="version-section">
                    <span class="version-section-label ${cls}">${label}</span>
                    <ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
                </div>`;
            };
            body.innerHTML = VERSION_HISTORY.map((v, idx) => `
                <div class="version-entry">
                    <div class="version-entry-head">
                        <span class="version-tag${idx === 0 ? ' current' : ''}">v${esc(v.version)}</span>
                        <span class="version-date">${esc(v.date)}</span>
                        ${v.title ? `<span class="version-title">${esc(v.title)}</span>` : ''}
                    </div>
                    ${section('추가', v.added, 'added')}
                    ${section('변경', v.changed, 'changed')}
                    ${section('수정', v.fixed, 'fixed')}
                </div>
            `).join('');
        }

        function openVersionModal() {
            renderVersionBody();
            document.getElementById('versionOverlay').classList.add('active');
        }

        function closeVersionModal() {
            document.getElementById('versionOverlay').classList.remove('active');
        }

        window.openVersionModal = openVersionModal;
        window.closeVersionModal = closeVersionModal;

        // OFFICEAGENT 문구를 1초 안에 3번 연속 클릭하면 site_key 표시를 토글 (디버그용 숨김 기능)
        (function setupEyebrowEasterEgg() {
            const eyebrow = document.querySelector('.eyebrow');
            if (!eyebrow) return;
            let clickCount = 0;
            let lastClickTime = 0;
            eyebrow.addEventListener('click', function () {
                const now = Date.now();
                clickCount = (now - lastClickTime < 1000) ? clickCount + 1 : 1;
                lastClickTime = now;
                if (clickCount >= 3) {
                    document.body.classList.toggle('reveal-keys');
                    clickCount = 0;
                }
            });
        })();

        // 새 챗봇을 추가하려면 이 배열에 site_key만 추가하면 됩니다. 이름/설명은 OfficeAgent에서 자동으로 가져옵니다.
        const CHATBOTS = [
            { site_key: 'pk_a7e39720c2c4784a2da2e0aa4224d00e' }, // 오피스키퍼_구축형 전문가
            { site_key: 'pk_0b28d01c27b3ff66722720bc5fa00c12' }, // 오피스키퍼 EP 전문가
            { site_key: 'pk_8c28225ba3877e8490fc6ad47cfbf0fb' }, // 오피스챗 전문가
            { site_key: 'pk_f6ab06795473c47fc2f96e06cb56ba1f' }, // 에스원 NEXT 메신저 전문가
            { site_key: 'pk_bd55099cf2778b691e5613990157762d' }, // 오피스넥스트 플랫폼 전문가
        ];

        const grid = document.getElementById('botGrid');
        const cards = CHATBOTS.map((bot, idx) => {
            // 2열 그리드 기준으로 새 줄이 시작될 때마다(짝수 idx, 첫 줄 제외) 흐린 구분선 추가
            if (idx > 0 && idx % 2 === 0) {
                const divider = document.createElement('div');
                divider.className = 'row-divider';
                grid.appendChild(divider);
            }
            const card = document.createElement('div');
            card.className = 'bot-card';
            card.innerHTML = `
                <div class="icon">💬</div>
                <h2><span class="skeleton" style="width:70%">&nbsp;</span></h2>
                <p class="desc"><span class="skeleton" style="width:100%">&nbsp;</span></p>
                <div class="site-key">${bot.site_key}</div>
                <button type="button" data-idx="${idx}" aria-label="챗봇 열기">챗봇 실행</button>
            `;
            grid.appendChild(card);
            return card;
        });

        // 새로고침마다 봇 개수만큼 API를 다시 부르면 rate limit에 쉽게 걸리므로,
        // 한 번 불러온 이름/설명은 10분 캐시해두고 그 안에서는 캐시만 사용
        const CACHE_KEY = 'chatbotInfoCache';
        const CACHE_TTL_MS = 10 * 60 * 1000;

        function readCache(siteKey) {
            try {
                const all = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
                return all[siteKey] || null;
            } catch (e) {
                return null;
            }
        }
        function writeCache(siteKey, entry) {
            try {
                const all = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
                all[siteKey] = entry;
                localStorage.setItem(CACHE_KEY, JSON.stringify(all));
            } catch (e) { /* 저장 공간 문제 등은 무시 */ }
        }

        function renderBotInfo(card, name, description, avatarUrl, color) {
            const h2 = card.querySelector('h2');
            const desc = card.querySelector('p.desc');
            const btn = card.querySelector('button');
            const icon = card.querySelector('.icon');
            card.classList.remove('is-error');
            h2.textContent = name;
            desc.textContent = description;
            btn.setAttribute('aria-label', name + ' 열기');
            btn.disabled = false;
            btn.style.opacity = '';
            btn.style.cursor = '';
            if (avatarUrl) {
                icon.classList.add('has-avatar');
                icon.innerHTML = `<img src="${esc(avatarUrl)}" alt="" onerror="this.parentElement.classList.remove('has-avatar'); this.parentElement.textContent='💬'">`;
            }
            if (color) {
                card.style.borderColor = color;
            }
        }

        function renderBotError(card, message) {
            const h2 = card.querySelector('h2');
            const desc = card.querySelector('p.desc');
            const btn = card.querySelector('button');
            card.classList.add('is-error');
            h2.textContent = '아직 사용할 수 없어요';
            desc.innerHTML = '이 사이트가 OfficeAgent에서 아직 승인되지 않았습니다.<div class="hint">' + message + '</div>';
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
        }

        async function loadBotInfo(bot, card) {
            const cached = readCache(bot.site_key);
            if (cached && Date.now() - cached.ts < CACHE_TTL_MS) {
                bot.name = cached.name;
                bot.description = cached.description;
                renderBotInfo(card, cached.name, cached.description, cached.avatarUrl, cached.color);
                return;
            }

            try {
                const res = await fetch('https://api-agent.officemail.ai/api/v1/guest/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ site_key: bot.site_key }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
                bot.name = data.chatbot_name || (data.agent && data.agent.name) || bot.site_key;
                bot.description = (data.agent && data.agent.description) || '';
                bot.avatarUrl = (data.agent && data.agent.avatar_url) || '';
                bot.color = data.color || '';
                renderBotInfo(card, bot.name, bot.description, bot.avatarUrl, bot.color);
                writeCache(bot.site_key, { name: bot.name, description: bot.description, avatarUrl: bot.avatarUrl, color: bot.color, ts: Date.now() });
            } catch (err) {
                // API 호출이 실패해도(예: rate limit) 이전에 성공했던 캐시가 있으면 그걸로 보여줌
                if (cached) {
                    bot.name = cached.name;
                    bot.description = cached.description;
                    renderBotInfo(card, cached.name, cached.description, cached.avatarUrl, cached.color);
                } else {
                    renderBotError(card, err.message);
                }
            }
        }

        (async function loadAllSequentially() {
            for (let i = 0; i < CHATBOTS.length; i++) {
                await loadBotInfo(CHATBOTS[i], cards[i]);
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
        })();

        let activeWidget = null;
        let activeSiteKey = null;

        // 모바일에서 챗봇이 열려 있을 때 단말기 뒤로가기를 누르면 페이지를 나가지 않고
        // 챗봇만 닫히도록, 열 때 히스토리를 한 단계 쌓아두고 popstate에서 close() 처리
        let chatHistoryPushed = false;

        function openActiveWidget() {
            if (!chatHistoryPushed) {
                history.pushState({ chatbotOpen: true }, '');
                chatHistoryPushed = true;
            }
            activeWidget.open();
        }

        window.addEventListener('popstate', function () {
            if (chatHistoryPushed) {
                chatHistoryPushed = false;
                if (activeWidget) activeWidget.close();
            }
        });

        grid.addEventListener('click', function (e) {
            const btn = e.target.closest('button[data-idx]');
            if (!btn || btn.disabled) return;
            const bot = CHATBOTS[Number(btn.dataset.idx)];

            if (activeSiteKey === bot.site_key && activeWidget) {
                openActiveWidget();
                return;
            }
            if (activeWidget) {
                activeWidget.destroy();
            }
            activeWidget = window.ChatWidget.init({
                site_key: bot.site_key,
                // 선택: 로그인 사용자 식별 시
                // customer: 'BASE64(로그인 사용자 식별자)',
            });
            activeSiteKey = bot.site_key;
            openActiveWidget();
        });
    </script>
</body>
</html>
