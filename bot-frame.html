<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챗봇</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: transparent; }
        /* 기본 플로팅 런처는 각 프레임 안에서도 숨김 (카드/닫기 바로만 열고 닫음) */
        .widget-launcher { display: none !important; }
    </style>
</head>
<body>
    <!-- OfficeAgent 임베드 챗봇 -->
    <script type="module" src="https://chatbot.officeagent.kr/widget-loader.js"></script>
    <script type="module">
        const siteKey = new URLSearchParams(location.search).get('site_key');
        const widget = window.ChatWidget.init({
            site_key: siteKey,
            storageNamespace: 'cb-' + siteKey,
            // 선택: 로그인 사용자 식별 시
            // customer: 'BASE64(로그인 사용자 식별자)',
        });
        widget.open();
    </script>
</body>
</html>
